          ansible.builtin.include_role:
            name: "{{ _role_path }}"
            tasks_from: assert
          vars:
            _caso: {"alloy_auth": {"type": "header", "header_name": "X-Api-Key"}}
            alloy_labels_cliente: "{{ _caso.alloy_labels_cliente | default(_validos.alloy_labels_cliente) }}"
            alloy_labels_entorno: "{{ _caso.alloy_labels_entorno | default(_validos.alloy_labels_entorno) }}"
            alloy_metrics_url: "{{ _caso.alloy_metrics_url | default(_validos.alloy_metrics_url) }}"
            alloy_logs_url: "{{ _caso.alloy_logs_url | default(_validos.alloy_logs_url) }}"
            alloy_auth: "{{ _caso.alloy_auth | default(_validos.alloy_auth) }}"
            alloy_logs_min_priority: "{{ _caso.alloy_logs_min_priority | default('warning') }}"
            alloy_version: "{{ _caso.alloy_version | default('1.21.1') }}"
            alloy_state: "{{ _caso.alloy_state | default('present') }}"
