---
# Prueba las validaciones de tasks/assert.yml sin tocar el host.
# Uso: uv run ansible-playbook -i tests/inventory tests/asserts.yml
- name: Validaciones del rol alloy
  hosts: localhost
  gather_facts: true
  vars:
    _role_path: "{{ playbook_dir | dirname }}"
    _validos:
      alloy_labels_cliente: test
      alloy_labels_entorno: ci
      alloy_metrics_url: https://receiver.test/api/prom/push
      alloy_logs_url: https://receiver.test/loki/api/v1/push
      alloy_auth:
        type: basic
        username: u
        password: p
  tasks:
    - name: "Caso: falta alloy_labels_cliente"
      block:
        - name: Incluir las validaciones
          ansible.builtin.include_role:
            name: "{{ _role_path }}"
            tasks_from: assert
          vars:
            _caso: {"alloy_labels_cliente": ""}
            alloy_labels_cliente: "{{ _caso.alloy_labels_cliente | default(_validos.alloy_labels_cliente) }}"
            alloy_labels_entorno: "{{ _caso.alloy_labels_entorno | default(_validos.alloy_labels_entorno) }}"
            alloy_metrics_url: "{{ _caso.alloy_metrics_url | default(_validos.alloy_metrics_url) }}"
            alloy_logs_url: "{{ _caso.alloy_logs_url | default(_validos.alloy_logs_url) }}"
            alloy_auth: "{{ _caso.alloy_auth | default(_validos.alloy_auth) }}"
            alloy_logs_min_priority: "{{ _caso.alloy_logs_min_priority | default('warning') }}"
            alloy_version: "{{ _caso.alloy_version | default('1.21.1') }}"
            alloy_state: "{{ _caso.alloy_state | default('present') }}"
            _alloy_distribution: "{{ _caso._alloy_distribution | default(ansible_facts['distribution']) }}"
            _alloy_distribution_major: "{{ _caso._alloy_distribution_major | default(ansible_facts['distribution_major_version']) }}"
        - name: Fallar si la validación no frenó
          ansible.builtin.fail:
            msg: "La validación no frenó"
      rescue:
        - name: Verificar el mensaje
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is defined
              - "'alloy_labels_cliente es obligatoria' in ansible_failed_result.msg"
            fail_msg: "Mensaje inesperado: {{ ansible_failed_result.msg | default('') }}"
            quiet: true
    - name: "Caso: falta alloy_labels_entorno"
      block:
        - name: Incluir las validaciones
          ansible.builtin.include_role:
            name: "{{ _role_path }}"
            tasks_from: assert
          vars:
            _caso: {"alloy_labels_entorno": ""}
            alloy_labels_cliente: "{{ _caso.alloy_labels_cliente | default(_validos.alloy_labels_cliente) }}"
            alloy_labels_entorno: "{{ _caso.alloy_labels_entorno | default(_validos.alloy_labels_entorno) }}"
            alloy_metrics_url: "{{ _caso.alloy_metrics_url | default(_validos.alloy_metrics_url) }}"
            alloy_logs_url: "{{ _caso.alloy_logs_url | default(_validos.alloy_logs_url) }}"
            alloy_auth: "{{ _caso.alloy_auth | default(_validos.alloy_auth) }}"
            alloy_logs_min_priority: "{{ _caso.alloy_logs_min_priority | default('warning') }}"
            alloy_version: "{{ _caso.alloy_version | default('1.21.1') }}"
            alloy_state: "{{ _caso.alloy_state | default('present') }}"
            _alloy_distribution: "{{ _caso._alloy_distribution | default(ansible_facts['distribution']) }}"
            _alloy_distribution_major: "{{ _caso._alloy_distribution_major | default(ansible_facts['distribution_major_version']) }}"
        - name: Fallar si la validación no frenó
          ansible.builtin.fail:
            msg: "La validación no frenó"
      rescue:
        - name: Verificar el mensaje
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is defined
              - "'alloy_labels_entorno es obligatoria' in ansible_failed_result.msg"
            fail_msg: "Mensaje inesperado: {{ ansible_failed_result.msg | default('') }}"
            quiet: true
    - name: "Caso: alloy_metrics_url vacía"
      block:
        - name: Incluir las validaciones
          ansible.builtin.include_role:
