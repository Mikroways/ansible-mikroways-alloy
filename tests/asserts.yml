      rescue:
        - name: Verificar el mensaje
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is defined
              - "'alloy_auth.type debe ser uno de none, basic, bearer, header, oauth2' in ansible_failed_result.msg"
            fail_msg: "Mensaje inesperado: {{ ansible_failed_result.msg | default('') }}"
            quiet: true
    - name: "Caso: basic sin password"
      block:
        - name: Incluir las validaciones
          ansible.builtin.include_role:
            name: "{{ _role_path }}"
            tasks_from: assert
          vars:
