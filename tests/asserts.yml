    - name: "Caso: Ubuntu 18 no soportado"
      block:
        - name: Incluir las validaciones
          ansible.builtin.include_role:
            name: "{{ _role_path }}"
            tasks_from: assert
          vars:
            _caso: {"_alloy_distribution": "Ubuntu", "_alloy_distribution_major": "18"}
