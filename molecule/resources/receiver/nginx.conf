# Receptor falso: exige la auth de cada prefijo y reenvía a Prometheus/Loki.
# Credenciales de prueba, no son secretos reales.
worker_processes 1;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 20m;

  server {
    listen 443 ssl;
    server_name receiver.test;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # --- basic: usuario distinto por endpoint ---
    location = /basic/api/prom/push {
      auth_basic "metrics";
      auth_basic_user_file /etc/nginx/auth/metrics.htpasswd;
      proxy_pass http://alloy-test-prometheus:9090/api/v1/write;
    }
    location = /basic/loki/api/v1/push {
      auth_basic "logs";
      auth_basic_user_file /etc/nginx/auth/logs.htpasswd;
      proxy_pass http://alloy-test-loki:3100/loki/api/v1/push;
    }

    # --- bearer ---
    location = /bearer/api/prom/push {
      if ($http_authorization != "Bearer test-token") { return 401; }
      proxy_pass http://alloy-test-prometheus:9090/api/v1/write;
    }
    location = /bearer/loki/api/v1/push {
      if ($http_authorization != "Bearer test-token") { return 401; }
      proxy_pass http://alloy-test-loki:3100/loki/api/v1/push;
    }

    # --- header ---
    location = /header/api/prom/push {
      if ($http_x_api_key != "test-key") { return 401; }
      proxy_pass http://alloy-test-prometheus:9090/api/v1/write;
    }
    location = /header/loki/api/v1/push {
      if ($http_x_api_key != "test-key") { return 401; }
      proxy_pass http://alloy-test-loki:3100/loki/api/v1/push;
    }

    # --- oauth2 client credentials ---
    # El token endpoint exige el client_id/secret por basic auth (así los manda
    # Alloy por defecto) y devuelve un token fijo.
    location = /oauth2/token {
      auth_basic "oauth2";
      auth_basic_user_file /etc/nginx/auth/oauth2.htpasswd;
      default_type application/json;
      return 200 '{"access_token":"oauth-token","token_type":"Bearer","expires_in":3600}';
    }
    location = /oauth2/api/prom/push {
      if ($http_authorization != "Bearer oauth-token") { return 401; }
      proxy_pass http://alloy-test-prometheus:9090/api/v1/write;
    }
    location = /oauth2/loki/api/v1/push {
      if ($http_authorization != "Bearer oauth-token") { return 401; }
      proxy_pass http://alloy-test-loki:3100/loki/api/v1/push;
    }

    location / { return 404; }
  }
}
