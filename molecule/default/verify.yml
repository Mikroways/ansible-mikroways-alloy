---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Leer la versión de Alloy instalada
      ansible.builtin.command: alloy --version
      register: _version
      changed_when: false

    - name: Verificar la versión fijada
      ansible.builtin.assert:
        that: "'v1.21.1' in _version.stdout"
        fail_msg: "Versión inesperada: {{ _version.stdout_lines | first | default('') }}"

    - name: Leer si el servicio está habilitado
      ansible.builtin.command: systemctl is-enabled alloy  # noqa: command-instead-of-module
      register: _enabled
      changed_when: false
      failed_when: false

    - name: Verificar que el servicio esté habilitado
      ansible.builtin.assert:
        that: _enabled.stdout == 'enabled'

    - name: Escribir logs de prueba en journald
      ansible.builtin.command: "logger -p user.{{ item }} alloy-test-{{ item }}-{{ inventory_hostname }}"
      loop: [err, info]
      changed_when: false

    # Como un login (session-N.scope) y un systemd-run (run-*.scope).
    # systemd-cat queda vivo mientras dura el sleep: journald le lee la unit.
    - name: Escribir logs desde scopes transitorios
      ansible.builtin.command:
        argv: "{{ ['systemd-run', '--quiet', '--scope'] + item.args
                  + ['sh', '-c', '{ echo ' ~ item.msg ~ '-' ~ inventory_hostname ~ '; sleep 2; } | systemd-cat -p err -t alloytest'] }}"
      loop:
        - {args: ["--unit=session-4242.scope"], msg: alloy-session}
        - {args: [], msg: alloy-run}
      loop_control:
        label: "{{ item.msg }}"
      changed_when: false

    - name: Leer el estado de staging y del backup
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/alloy/.staging
        - /etc/alloy/.conf.d.prev
        - /var/lib/alloy/staging
        - /var/lib/alloy/conf.d.prev
      register: _dirs

    # Fuera del home del usuario alloy, donde root hacía cp y rm.
    - name: Verificar staging y backup en /etc/alloy, de root
      ansible.builtin.assert:
        that:
          - _dirs.results[0].stat.isdir | default(false)
          - _dirs.results[0].stat.pw_name == 'root'
          - _dirs.results[0].stat.mode == '0700'
          - _dirs.results[1].stat.isdir | default(false)
          - _dirs.results[1].stat.pw_name == 'root'
          - not _dirs.results[2].stat.exists
          - not _dirs.results[3].stat.exists
        fail_msg: "{{ _dirs.results | map(attribute='stat') | list | to_json }}"

    - name: Volver a detectar las units vigiladas
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: linux/detect

    # El aviso de la unit que falta explica el sufijo; el timer y el mount no
    # dan aviso.
    - name: Verificar los avisos de units
      ansible.builtin.assert:
        that:
          - _avisos | select('search', 'no-existe.service') | select('search', 'sin sufijo') | list | length > 0
          - _avisos | select('search', 'alloy-test-dummy') | list | length == 0
          - _avisos | select('search', 'mnt-alloytest') | list | length == 0
        fail_msg: "Avisos: {{ _avisos }}"
      vars:
        _avisos: "{{ ansible_facts.alloy_avisos | default([]) }}"

    - name: Escribir logs de prueba en archivo
      ansible.builtin.shell:
        cmd: |
          echo "$(date -Is) ERROR alloy-file-err-{{ inventory_hostname }}" >> /var/log/alloy-test.log
          echo "$(date -Is) INFO alloy-file-info-{{ inventory_hostname }}" >> /var/log/alloy-test.log
          echo "$(date -Is) ERROR alloy-file2-err-{{ inventory_hostname }}" >> /var/log/alloy-test2/app.log
          echo "$(date -Is) INFO alloy-file2-info-{{ inventory_hostname }}" >> /var/log/alloy-test2/app.log
      changed_when: false

    - name: Verificar lo que llega al receptor
      ansible.builtin.include_tasks: ../resources/verify-tasks.yml
      vars:
        _sel: 'cliente="test",entorno="ci",os="linux",host="{{ inventory_hostname }}"'
        _rotacion: "{{ lookup('ansible.builtin.file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/rotacion-ts', errors='ignore') | default('0', true) }}"
        verify_prom_queries:
          - {query: 'alloy_build_info{ {{ _sel }},job="integrations/alloy",instance="{{ inventory_hostname }}"}', expect: present}
          - {query: 'prometheus_remote_storage_samples_total{ {{ _sel }} }', expect: present}
          # Después de rotar el password se sigue enviando: hay muestras
          # posteriores a la rotación (hora guardada por el side_effect).
          - {query: 'timestamp(alloy_build_info{ {{ _sel }} }) > {{ _rotacion }}', expect: present}
          # Host y NTP.
          - {query: 'node_load1{ {{ _sel }},job="integrations/node_exporter",instance="{{ inventory_hostname }}"}', expect: present}
          - {query: 'node_timex_sync_status{ {{ _sel }} }', expect: present}
          - {query: 'node_filesystem_avail_bytes{ {{ _sel }} }', expect: present}
          - {query: 'node_boot_time_seconds{ {{ _sel }} }', expect: present}
          # Fuera del set de collectors o de la allowlist.
          - {query: 'node_netstat_Tcp_InSegs{ {{ _sel }} }', expect: absent}
          - {query: 'node_cpu_guest_seconds_total{ {{ _sel }} }', expect: absent}
          - {query: 'node_network_receive_bytes_total{ {{ _sel }},device="lo"}', expect: absent}
          # Servicios, NTP, procesos y textfile.
          - {query: 'node_systemd_unit_state{ {{ _sel }},name="alloy-test-dummy.service",state="active"} == 1', expect: present}
          # NTP: se vigila la unit que corre, no chrony (instalado y parado).
          - {query: 'node_systemd_unit_state{ {{ _sel }},name="ntpd.service",state="active"} == 1', expect: present}
          - {query: 'node_systemd_unit_state{ {{ _sel }},name=~"chronyd?.service"}', expect: absent}
          # Units sin sufijo, timers y mounts.
          - {query: 'node_systemd_unit_state{ {{ _sel }},name="alloy-test-dummy.timer",state="active"} == 1', expect: present}
          - {query: 'node_systemd_unit_state{ {{ _sel }},name="mnt-alloytest.mount",state="active"} == 1', expect: present}
          - {query: 'namedprocess_namegroup_num_procs{ {{ _sel }},groupname="sleep",job="integrations/process_exporter"} >= 1', expect: present}
          - {query: 'backup_test_last_success_timestamp_seconds{ {{ _sel }} }', expect: present}
          - {query: 'node_systemd_unit_state{ {{ _sel }},state="inactive"}', expect: absent}
          - {query: 'otro_metric_test{ {{ _sel }} }', expect: absent}
        verify_loki_queries:
          - {query: '{ {{ _sel }},job="integrations/journal",level="error"} |= "alloy-test-err-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }},app="test"} |= "alloy-file-err-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }} } |= "alloy-test-info-{{ inventory_hostname }}"', expect: absent}
          - {query: '{ {{ _sel }} } |= "alloy-file-info-{{ inventory_hostname }}"', expect: absent}
          # Un ítem que pisa job no puede apagar el filtro de nivel.
          - {query: '{ {{ _sel }},app="test2"} |= "alloy-file2-err-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }},app="test2"} |= "alloy-file2-info-{{ inventory_hostname }}"', expect: absent}
          # El label unit de journald no crece con cada login o systemd-run.
          - {query: '{ {{ _sel }},unit="session.scope"} |= "alloy-session-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }},unit="run.scope"} |= "alloy-run-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }},unit=~"session-[0-9]+[.]scope|run-.+"}', expect: absent}
