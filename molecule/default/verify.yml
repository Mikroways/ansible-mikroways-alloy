---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verificar lo que llega al receptor
      ansible.builtin.include_tasks: ../resources/verify-tasks.yml
      vars:
        _sel: 'cliente="test",entorno="ci",os="linux",host="{{ inventory_hostname }}"'
        verify_prom_queries:
          - {query: 'alloy_build_info{ {{ _sel }},job="integrations/alloy"}', expect: present}
