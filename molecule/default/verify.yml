---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Leer la versión de Alloy instalada
      ansible.builtin.command: alloy --version
      register: _version
      changed_when: false

    - name: Verificar la versión fijada
      ansible.builtin.assert:
        that: "'v1.21.1' in _version.stdout"
        fail_msg: "Versión inesperada: {{ _version.stdout_lines | first | default('') }}"

    - name: Leer si el servicio está habilitado
      ansible.builtin.command: systemctl is-enabled alloy  # noqa: command-instead-of-module
      register: _enabled
      changed_when: false
      failed_when: false

    - name: Verificar que el servicio esté habilitado
      ansible.builtin.assert:
        that: _enabled.stdout == 'enabled'

    - name: Escribir logs de prueba en journald
      ansible.builtin.command: "logger -p user.{{ item }} alloy-test-{{ item }}-{{ inventory_hostname }}"
      loop: [err, info]
      changed_when: false

    - name: Escribir logs de prueba en archivo
      ansible.builtin.shell:
        cmd: |
          echo "$(date -Is) ERROR alloy-file-err-{{ inventory_hostname }}" >> /var/log/alloy-test.log
          echo "$(date -Is) INFO alloy-file-info-{{ inventory_hostname }}" >> /var/log/alloy-test.log
      changed_when: false

    - name: Verificar lo que llega al receptor
      ansible.builtin.include_tasks: ../resources/verify-tasks.yml
      vars:
        _sel: 'cliente="test",entorno="ci",os="linux",host="{{ inventory_hostname }}"'
        verify_prom_queries:
          - {query: 'alloy_build_info{ {{ _sel }},job="integrations/alloy",instance="{{ inventory_hostname }}"}', expect: present}
          - {query: 'prometheus_remote_storage_samples_total{ {{ _sel }} }', expect: present}
          # Muestra reciente: después de rotar el password se sigue enviando.
          - {query: '(time() - timestamp(alloy_build_info{ {{ _sel }} })) < 150', expect: present}
          # Host y NTP.
          - {query: 'node_load1{ {{ _sel }},job="integrations/node_exporter",instance="{{ inventory_hostname }}"}', expect: present}
          - {query: 'node_timex_sync_status{ {{ _sel }} }', expect: present}
          - {query: 'node_filesystem_avail_bytes{ {{ _sel }} }', expect: present}
          # Fuera del set de collectors o de la allowlist.
          - {query: 'node_netstat_Tcp_InSegs{ {{ _sel }} }', expect: absent}
          - {query: 'node_cpu_guest_seconds_total{ {{ _sel }} }', expect: absent}
          - {query: 'node_network_receive_bytes_total{ {{ _sel }},device="lo"}', expect: absent}
          # Servicios, NTP, procesos y textfile.
          - {query: 'node_systemd_unit_state{ {{ _sel }},name="alloy-test-dummy.service",state="active"} == 1', expect: present}
          - {query: 'node_systemd_unit_state{ {{ _sel }},name=~"chronyd?.service|systemd-timesyncd.service",state="active"}', expect: present}
          - {query: 'namedprocess_namegroup_num_procs{ {{ _sel }},groupname="sleep",job="integrations/process_exporter"} >= 1', expect: present}
          - {query: 'backup_test_last_success_timestamp_seconds{ {{ _sel }} }', expect: present}
          - {query: 'node_systemd_unit_state{ {{ _sel }},state="inactive"}', expect: absent}
          - {query: 'otro_metric_test{ {{ _sel }} }', expect: absent}
        verify_loki_queries:
          - {query: '{ {{ _sel }},job="integrations/journal",level="error"} |= "alloy-test-err-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }},app="test"} |= "alloy-file-err-{{ inventory_hostname }}"', expect: present}
          - {query: '{ {{ _sel }} } |= "alloy-test-info-{{ inventory_hostname }}"', expect: absent}
          - {query: '{ {{ _sel }} } |= "alloy-file-info-{{ inventory_hostname }}"', expect: absent}
