---
# 1. Config inválida: el rol falla y conf.d/ queda como estaba.
# 2. Rotación del password de métricas: Alloy toma el nuevo sin reinstalar.
# (El downgrade se prueba en el escenario version.)
- name: Config inválida no llega al servicio
  hosts: all
  gather_facts: true
  tasks:
    - name: Converger con un archivo extra roto
      block:
        - name: Aplicar el rol con config rota
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            alloy_extra_config_files:
              - {name: roto, content: "esto no es alloy"}
        - name: Fallar si el rol aceptó la config rota
          ansible.builtin.fail:
            msg: El rol debía fallar con la config rota
      rescue:
        - name: Verificar que falló en la validación (y no por otra cosa)
          ansible.builtin.assert:
            that: ansible_failed_task.name is search('alloy validate')
            fail_msg: "Falló otra tarea: {{ ansible_failed_task.name }}"
            quiet: true

    - name: Buscar el archivo roto en conf.d
      ansible.builtin.stat:
        path: /etc/alloy/conf.d/roto.alloy
      register: _roto

    - name: Verificar que el archivo roto no llegó a conf.d
      ansible.builtin.assert:
        that: not _roto.stat.exists

    - name: Leer el estado del servicio
      ansible.builtin.command: systemctl is-active alloy  # noqa: command-instead-of-module
      register: _active
      changed_when: false
      failed_when: false

    - name: Verificar que el servicio sigue activo
      ansible.builtin.assert:
        that: _active.stdout == 'active'

- name: Config que pasa alloy validate pero falla al cargar
  hosts: all
  gather_facts: true
  tasks:
    - name: Converger con un componente que no se puede construir
      block:
        - name: Aplicar el rol con un selector inválido
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            alloy_extra_config_files:
              - name: no-carga
                content: |
                  loki.process "no_carga" {
                    forward_to = []
                    stage.match {
                      selector = "{a=b}"
                      action   = "drop"
                    }
                  }
        - name: Fallar si el rol aceptó la config que no carga
          ansible.builtin.fail:
            msg: El rol debía fallar con la config que no carga
      rescue:
        - name: Verificar que falló al aplicar la config (y no por otra cosa)
          ansible.builtin.assert:
            that: ansible_failed_task.name is search('Aplicar la config')
            fail_msg: "Falló otra tarea: {{ ansible_failed_task.name }}"
            quiet: true

    - name: Buscar el archivo que no carga en conf.d
      ansible.builtin.stat:
        path: /etc/alloy/conf.d/no-carga.alloy
      register: _nocarga

    - name: Verificar que conf.d volvió a la config anterior
      ansible.builtin.assert:
        that: not _nocarga.stat.exists

    - name: Reiniciar Alloy (con conf.d restaurado tiene que arrancar)
      ansible.builtin.systemd_service:
        name: alloy
        state: restarted

    - name: Leer el estado del servicio después del reinicio
      ansible.builtin.command: systemctl is-active alloy  # noqa: command-instead-of-module
      register: _active2
      changed_when: false
      failed_when: false
      retries: 5
      delay: 2
      until: _active2.stdout == 'active'

    - name: Verificar que el servicio arrancó
      ansible.builtin.assert:
        that: _active2.stdout == 'active'

- name: Rotar el password en el receptor
  hosts: localhost
  gather_facts: false
  vars:
    _ca: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/resources/receiver/.ca"
  tasks:
    - name: Escribir el htpasswd nuevo de métricas
      ansible.builtin.shell:
        cmd: >-
          set -e;
          printf 'metrics-user:%s\n' "$(openssl passwd -apr1 'metrics-pass-2')"
          > {{ _ca }}/auth/metrics.htpasswd
      changed_when: true

- name: Converger con el password nuevo
  hosts: all
  gather_facts: true
  vars:
    alloy_auth:
      type: basic
      password: metrics-pass-2
  tasks:
    - name: Aplicar el rol
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

- name: Guardar la hora de la rotación
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Escribir la hora de la rotación
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rotacion-ts"
        content: "{{ now(utc=true).timestamp() | int }}"
        mode: "0644"
