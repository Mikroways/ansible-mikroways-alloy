---
# 1. Primera corrida: un solo arranque, sin el reload de los secretos.
# 2. --check con un cambio de config informa que conf.d cambiaría.
# 3. Migración desde 0.1.0: --check no falla y staging y backup salen de
#    /var/lib/alloy.
# 4. Config inválida: el rol falla y conf.d/ queda como estaba.
# 5. Rotación del password de métricas: Alloy toma el nuevo sin reinstalar.
# (El downgrade se prueba en el escenario version.)
- name: La primera corrida no recarga después de arrancar
  hosts: all
  gather_facts: false
  tasks:
    # Mensajes de systemd (PID 1) sobre la unit, no los de Alloy.
    - name: Leer los mensajes de systemd sobre alloy.service
      ansible.builtin.command: journalctl --no-pager -o cat _PID=1 UNIT=alloy.service
      register: _systemd_alloy
      changed_when: false

    - name: Verificar que no hubo reload
      ansible.builtin.assert:
        that: _reloads | length == 0
        fail_msg: "Hubo reload(s) de alloy.service después del arranque: {{ _reloads }}"
      vars:
        _reloads: "{{ _systemd_alloy.stdout_lines | select('search', 'Reloading') | list }}"

- name: --check informa los cambios de config
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Correr el rol en --check con otro scrape_interval
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - --check
          - -i
          - "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory"
          - "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/check-cambio.yml"
      changed_when: false

- name: Dejar los hosts como la 0.1.0
  hosts: all
  gather_facts: false
  tasks:
    - name: Mover staging y backup a /var/lib/alloy, como la 0.1.0
      ansible.builtin.shell:
        cmd: >-
          mv /etc/alloy/.staging /var/lib/alloy/staging &&
          mv /etc/alloy/.conf.d.prev /var/lib/alloy/conf.d.prev
      changed_when: true

# El primer --check después de actualizar el rol corre sin /etc/alloy/.staging.
- name: --check sobre un host con la 0.1.0
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Correr el rol en --check
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - --check
          - -i
          - "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/inventory"
          - "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/converge.yml"
      changed_when: false

- name: Migración desde 0.1.0
  hosts: all
  gather_facts: true
  tasks:
    - name: Aplicar el rol
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Leer los directorios viejos
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/var/lib/alloy/staging, /var/lib/alloy/conf.d.prev]
      register: _viejos

    - name: Verificar que se borraron
      ansible.builtin.assert:
        that: _viejos.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "Quedaron: {{ _viejos.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    # Los avisos de la corrida completa quedan en ansible_facts.alloy_avisos.
    - name: Verificar los avisos de la corrida
      ansible.builtin.assert:
        that:
          - "'alloy no puede leer /var/log/alloy-test-privado.log. El rol no cambia permisos' in _avisos | join('\n')"
          - _avisos | select('search', 'no-existe.service') | list | length == 1
        fail_msg: "Avisos: {{ _avisos }}"
      vars:
        _avisos: "{{ ansible_facts.alloy_avisos | default([]) }}"

- name: Config inválida no llega al servicio
  hosts: all
  gather_facts: true
  tasks:
    - name: Converger con un archivo extra roto
      block:
        - name: Aplicar el rol con config rota
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            alloy_extra_config_files:
              - {name: roto, content: "esto no es alloy"}
        - name: Fallar si el rol aceptó la config rota
          ansible.builtin.fail:
            msg: El rol debía fallar con la config rota
      rescue:
        - name: Verificar que falló en la validación (y no por otra cosa)
          ansible.builtin.assert:
            that: ansible_failed_task.name is search('alloy validate')
            fail_msg: "Falló otra tarea: {{ ansible_failed_task.name }}"
            quiet: true

    - name: Buscar el archivo roto en conf.d
      ansible.builtin.stat:
        path: /etc/alloy/conf.d/roto.alloy
      register: _roto

    - name: Verificar que el archivo roto no llegó a conf.d
      ansible.builtin.assert:
        that: not _roto.stat.exists

    - name: Leer el estado del servicio
      ansible.builtin.command: systemctl is-active alloy  # noqa: command-instead-of-module
      register: _active
      changed_when: false
      failed_when: false

    - name: Verificar que el servicio sigue activo
      ansible.builtin.assert:
        that: _active.stdout == 'active'

- name: Config que pasa alloy validate pero falla al cargar
  hosts: all
  gather_facts: true
  tasks:
    - name: Converger con un componente que no se puede construir
      block:
        - name: Aplicar el rol con un selector inválido
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            alloy_extra_config_files:
              - name: no-carga
                content: |
                  loki.process "no_carga" {
                    forward_to = []
                    stage.match {
                      selector = "{a=b}"
                      action   = "drop"
                    }
                  }
        - name: Fallar si el rol aceptó la config que no carga
          ansible.builtin.fail:
            msg: El rol debía fallar con la config que no carga
      rescue:
        - name: Verificar que falló al aplicar la config (y no por otra cosa)
          ansible.builtin.assert:
            that: ansible_failed_task.name is search('Aplicar la config')
            fail_msg: "Falló otra tarea: {{ ansible_failed_task.name }}"
            quiet: true

    - name: Buscar el archivo que no carga en conf.d
      ansible.builtin.stat:
        path: /etc/alloy/conf.d/no-carga.alloy
      register: _nocarga

    - name: Verificar que conf.d volvió a la config anterior
      ansible.builtin.assert:
        that: not _nocarga.stat.exists

    - name: Reiniciar Alloy (con conf.d restaurado tiene que arrancar)
      ansible.builtin.systemd_service:
        name: alloy
        state: restarted

    - name: Leer el estado del servicio después del reinicio
      ansible.builtin.command: systemctl is-active alloy  # noqa: command-instead-of-module
      register: _active2
      changed_when: false
      failed_when: false
      retries: 5
      delay: 2
      until: _active2.stdout == 'active'

    - name: Verificar que el servicio arrancó
      ansible.builtin.assert:
        that: _active2.stdout == 'active'

- name: Rotar el password en el receptor
  hosts: localhost
  gather_facts: false
  vars:
    _ca: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/resources/receiver/.ca"
  tasks:
    - name: Escribir el htpasswd nuevo de métricas
      ansible.builtin.shell:
        cmd: >-
          set -e;
          printf 'metrics-user:%s\n' "$(openssl passwd -apr1 'metrics-pass-2')"
          > {{ _ca }}/auth/metrics.htpasswd
      changed_when: true

- name: Converger con el password nuevo
  hosts: all
  gather_facts: true
  vars:
    alloy_auth:
      type: basic
      password: metrics-pass-2
  tasks:
    - name: Aplicar el rol
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

- name: Guardar la hora de la rotación
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Escribir la hora de la rotación
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rotacion-ts"
        content: "{{ now(utc=true).timestamp() | int }}"
        mode: "0644"
