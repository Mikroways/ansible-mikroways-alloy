---
# 1. Downgrade a mano y volver a converger: queda la versión fijada.
# 2. Config inválida: el rol falla y conf.d/ queda como estaba.
# 3. Rotación del password de métricas: Alloy toma el nuevo sin reinstalar.
- name: Instalar una versión anterior a mano
  hosts: all
  gather_facts: true
  vars:
    _old: "1.21.0"
    _arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    _ext: "{{ 'deb' if ansible_facts['os_family'] == 'Debian' else 'rpm' }}"
    _pkg: "alloy-{{ _old }}-1.{{ _arch }}.{{ _ext }}"
  tasks:
    - name: Bajar el paquete viejo
      ansible.builtin.get_url:
        url: "https://github.com/grafana/alloy/releases/download/v{{ _old }}/{{ _pkg }}"
        dest: "/tmp/{{ _pkg }}"
        mode: "0644"

    - name: Instalar el paquete viejo (Debian)
      ansible.builtin.command: "dpkg -i --force-confold /tmp/{{ _pkg }}"
      changed_when: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Instalar el paquete viejo (RedHat)
      ansible.builtin.command: "rpm -U --oldpackage --nodeps /tmp/{{ _pkg }}"  # noqa: command-instead-of-module
      changed_when: true
      when: ansible_facts['os_family'] == 'RedHat'

- name: Volver a converger
  ansible.builtin.import_playbook: converge.yml

- name: Config inválida no llega al servicio
  hosts: all
  gather_facts: true
  tasks:
    - name: Converger con un archivo extra roto
      block:
        - name: Aplicar el rol con config rota
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            alloy_extra_config_files:
              - {name: roto, content: "esto no es alloy"}
        - name: Fallar si el rol aceptó la config rota
          ansible.builtin.fail:
            msg: El rol debía fallar con la config rota
      rescue:
        - name: Verificar que falló en la validación (y no por otra cosa)
          ansible.builtin.assert:
            that: ansible_failed_task.name is search('alloy validate')
            fail_msg: "Falló otra tarea: {{ ansible_failed_task.name }}"
            quiet: true

    - name: Buscar el archivo roto en conf.d
      ansible.builtin.stat:
        path: /etc/alloy/conf.d/roto.alloy
      register: _roto

    - name: Verificar que el archivo roto no llegó a conf.d
      ansible.builtin.assert:
        that: not _roto.stat.exists

    - name: Leer el estado del servicio
      ansible.builtin.command: systemctl is-active alloy  # noqa: command-instead-of-module
      register: _active
      changed_when: false
      failed_when: false

    - name: Verificar que el servicio sigue activo
      ansible.builtin.assert:
        that: _active.stdout == 'active'

- name: Rotar el password en el receptor
  hosts: localhost
  gather_facts: false
  vars:
    _ca: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/resources/receiver/.ca"
  tasks:
    - name: Escribir el htpasswd nuevo de métricas
      ansible.builtin.shell:
        cmd: >-
          set -e;
          printf 'metrics-user:%s\n' "$(openssl passwd -apr1 'metrics-pass-2')"
          > {{ _ca }}/auth/metrics.htpasswd
      changed_when: true

- name: Converger con el password nuevo
  hosts: all
  gather_facts: true
  vars:
    alloy_auth:
      type: basic
      password: metrics-pass-2
  tasks:
    - name: Aplicar el rol
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
