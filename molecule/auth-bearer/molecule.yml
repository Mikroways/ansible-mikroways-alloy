---
# Escenario auth-bearer: envío con auth bearer.
dependency:
  name: galaxy
  options:
    requirements-file: meta/requirements.yml
driver:
  name: docker
platforms:
  - &plataforma
    name: alloy-ubuntu2404
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
      - /var/cache/alloy
    networks:
      - name: alloy-test
  - <<: *plataforma
    name: alloy-rockylinux9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
provisioner:
  name: ansible
  playbooks:
    prepare: ../resources/prepare.yml
    cleanup: ../resources/cleanup.yml
    verify: ../resources/verify-envio.yml
  inventory:
    group_vars:
      all:
        alloy_metrics_url: https://receiver.test/bearer/api/prom/push
        alloy_logs_url: https://receiver.test/bearer/loki/api/v1/push
        alloy_labels_cliente: test
        alloy_labels_entorno: ci
        alloy_tls_ca_pem: "{{ lookup('file', lookup('env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/molecule/resources/receiver/.ca/ca.crt') }}"
        alloy_auth:
          type: bearer
          token: test-token
verifier:
  name: ansible
