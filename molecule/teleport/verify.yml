---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verificar lo que llega al receptor
      ansible.builtin.include_tasks: ../resources/verify-tasks.yml
      vars:
        _sel: 'cliente="test",entorno="ci",os="linux",host="{{ inventory_hostname }}"'
        verify_prom_queries:
          - {query: 'process_state{ {{ _sel }},job="integrations/teleport"}', expect: present}
          - {query: 'teleport_build_info{ {{ _sel }},job="integrations/teleport"}', expect: present}
          - {query: 'node_systemd_unit_state{ {{ _sel }},name="teleport.service",state="active"} == 1', expect: present}
          - {query: 'teleport_otra{ {{ _sel }} }', expect: absent}
