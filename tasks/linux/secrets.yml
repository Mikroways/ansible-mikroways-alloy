---
# Escribe los secretos en archivos aparte (root:alloy 0640). La config los
# referencia por ruta (*_file o local.file), nunca con el valor en línea.
- name: Calcular los archivos de secretos
  ansible.builtin.set_fact:
    _alloy_secret_files: "{{ _files }}"
  vars:
    _field:
      basic: {suffix: password, key: password}
      bearer: {suffix: token, key: token}
      header: {suffix: header, key: header_value}
    _endpoints: >-
      {{ [{'ep': 'metrics', 'auth': _alloy_auth_metrics}]
         + ([{'ep': 'logs', 'auth': _alloy_auth_logs}] if _alloy_logs_on | bool else []) }}
    _files: >-
      {%- set out = [] -%}
      {%- for e in _endpoints -%}
        {%- set t = e.auth.type | default('none') -%}
        {%- if t in _field -%}
          {%- set _ = out.append({'name': e.ep ~ '_' ~ _field[t].suffix, 'content': e.auth[_field[t].key]}) -%}
        {%- elif t == 'oauth2' -%}
          {%- set _ = out.append({'name': e.ep ~ '_client_secret', 'content': e.auth.oauth2.client_secret}) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if alloy_tls_ca_pem | length > 0 -%}
        {%- set _ = out.append({'name': 'ca.pem', 'content': alloy_tls_ca_pem ~ '\n'}) -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: Escribir los secretos
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ _alloy_secrets_dir }}/{{ item.name }}"
    owner: root
    group: alloy
    mode: "0640"
  loop: "{{ _alloy_secret_files }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  diff: false
  notify: Reload alloy

- name: Listar los secretos existentes
  ansible.builtin.find:
    paths: "{{ _alloy_secrets_dir }}"
    file_type: file
  register: _alloy_secrets_found

- name: Borrar secretos que ya no se usan
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _alloy_secrets_found.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (_alloy_secret_files | map(attribute='name'))
  notify: Reload alloy
