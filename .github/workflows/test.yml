---
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
      - name: Instalar dependencias
        run: uv sync
      # ansible-lint resuelve los módulos de los playbooks de Molecule
      # (community.docker): sin las colecciones falla el syntax-check.
      - name: Instalar colecciones
        run: uv run ansible-galaxy collection install -r molecule/requirements.yml
      - name: yamllint
        run: uv run yamllint .
      - name: ansible-lint
        run: uv run ansible-lint

  asserts:
    name: Validaciones de variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
      - name: Instalar dependencias
        run: uv sync
      - name: Correr tests/asserts.yml
        run: uv run ansible-playbook -i tests/inventory tests/asserts.yml
      - name: Correr tests/rol.yml
        run: uv run ansible-playbook -i tests/inventory tests/rol.yml

  molecule:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - version
          - auth-bearer
          - auth-header
          - auth-oauth2
          - proxy
          - teleport
          - absent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
      - name: Instalar dependencias
        run: uv sync
      - name: Correr Molecule
        run: uv run molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
